version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: owo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: owobot
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - owo-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/owobot --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # OwO Bot Application
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: owo-bot
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - MONGODB_URI=mongodb://mongodb:27017/owobot
      - NODE_ENV=production
    networks:
      - owo-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  owo-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
